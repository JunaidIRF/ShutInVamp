<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151722"/>
      <stop offset="50%" stop-color="#0f1118"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>

    <!-- Cyan Character Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Violet Character Gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Sync Pulse Gradient -->
    <linearGradient id="syncGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow for Central Diamond -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" stroke="#222634" stroke-width="4"/>
  <rect x="22" y="22" width="468" height="468" rx="98" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>

  <!-- Subtle Circular Sync Grid / Radar Ring -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="#1f2433" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="230" r="80" fill="none" stroke="#252b3d" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Left Character (Actor / Initiator) -->
  <g id="actor-left">
    <!-- Head -->
    <circle cx="160" cy="158" r="28" fill="url(#cyanGrad)"/>
    <!-- Body / Dynamic Arm reaching forward -->
    <path d="M 124 280 C 124 222 152 206 178 206 C 198 206 210 216 222 226 L 246 230 C 232 242 210 248 186 248 C 168 248 148 260 142 280 Z" fill="url(#cyanGrad)"/>
    <!-- Torso Spine Arc -->
    <path d="M 160 206 C 145 228 142 260 148 290" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Right Character (Partner / Target) -->
  <g id="actor-right">
    <!-- Head -->
    <circle cx="352" cy="158" r="28" fill="url(#violetGrad)"/>
    <!-- Body / Dynamic Arm reaching forward -->
    <path d="M 388 280 C 388 222 360 206 334 206 C 314 206 302 216 290 226 L 266 230 C 280 242 302 248 326 248 C 344 248 364 260 370 280 Z" fill="url(#violetGrad)"/>
    <!-- Torso Spine Arc -->
    <path d="M 352 206 C 367 228 370 260 364 290" fill="none" stroke="#c084fc" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Master Sync Link / Arc between characters -->
  <path d="M 176 216 Q 256 170 336 216" fill="none" stroke="url(#syncGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 190 238 Q 256 270 322 238" fill="none" stroke="url(#syncGrad)" stroke-width="4" stroke-dasharray="8 6" stroke-linecap="round"/>

  <!-- Central Keyframe Diamond (Unity Animation Window Symbol) -->
  <g id="keyframe-center" filter="url(#softGlow)">
    <!-- Outer pulse diamond -->
    <polygon points="256,194 294,230 256,266 218,230" fill="none" stroke="url(#syncGrad)" stroke-width="4"/>
    <!-- Core diamond -->
    <polygon points="256,206 280,230 256,254 232,230" fill="#ffffff"/>
    <circle cx="256" cy="230" r="5" fill="#f43f5e"/>
  </g>

  <!-- Bottom Dopesheet Timeline Track -->
  <g id="dopesheet-track" transform="translate(0, 10)">
    <!-- Track line -->
    <rect x="96" y="380" width="320" height="8" rx="4" fill="#1b1f2b"/>
    <!-- Active play range -->
    <rect x="156" y="380" width="200" height="8" rx="4" fill="url(#syncGrad)" opacity="0.8"/>

    <!-- Keyframe diamonds on timeline -->
    <!-- Left keyframe -->
    <polygon points="160,374 168,384 160,394 152,384" fill="#38bdf8"/>
    <!-- Center synced event keyframe -->
    <polygon points="256,370 270,384 256,398 242,384" fill="#ffffff" stroke="#f43f5e" stroke-width="3"/>
    <!-- Right keyframe -->
    <polygon points="352,374 360,384 352,394 344,384" fill="#c084fc"/>

    <!-- Playhead Scrub Line -->
    <line x1="256" y1="340" x2="256" y2="408" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Playhead Needle Head -->
    <polygon points="248,340 264,340 256,350" fill="#ffffff"/>

    <!-- Track Ticks -->
    <line x1="120" y1="382" x2="120" y2="386" stroke="#333a4d" stroke-width="2"/>
    <line x1="208" y1="382" x2="208" y2="386" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="304" y1="382" x2="304" y2="386" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="392" y1="382" x2="392" y2="386" stroke="#333a4d" stroke-width="2"/>
  </g>
</svg>
